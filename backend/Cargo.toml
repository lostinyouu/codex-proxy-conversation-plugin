[package]
name = "conversation-lab"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
publish = false
autotests = false

[[test]]
name = "main"
path = "tests/main.rs"

[dependencies]
gateway-plugin-sdk = { git = "https://github.com/zyycn/codex-proxy-rs.git", rev = "8c8618aa0f841638262262e3338c115bc075f125", features = ["io"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", default-features = false, features = ["io-std", "macros", "rt"] }

[dev-dependencies]
tokio = { version = "1.52.3", default-features = false, features = ["io-util", "process", "time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"
